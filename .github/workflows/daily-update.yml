name: Daily private data update

# Kaatopaikka Capital has intentionally stopped public GitHub Pages publishing.
# This workflow may refresh private repository artifacts but MUST NOT deploy Pages.
# If the site is later unpublished in Settings > Pages, this workflow cannot restore it.
on:
  schedule:
    - cron: "20 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Fetch prices, update model, portfolio and simulation
        run: python update_site.py
      - name: Save results only to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json portfolio.json simulation.json model.xlsx
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "Daily update $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push && exit 0
            sleep 10
          done
          echo "Could not push the daily update" && exit 1

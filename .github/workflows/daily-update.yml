name: Daily update & GitHub Pages

on:
  schedule:
    - cron: "20 17 * * 1-5"  # weekdays after Nordic market close
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"

      - name: Install packages
        if: github.event_name != 'push'
        run: pip install -r requirements.txt

      - name: Fetch prices, update model, portfolio and simulation
        if: github.event_name != 'push'
        run: python update_site.py

      - name: Rebuild source-validated historical replay (if inputs available)
        if: github.event_name != 'push'
        run: python historical_data/refresh_status.py

      - name: Save results to the repository
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json portfolio.json simulation.json model.xlsx historical-status.json
          git add -u historical-backtest.json 2>/dev/null || true
          if [ -f historical-backtest.json ]; then git add historical-backtest.json; fi
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "Daily update $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push && exit 0
            sleep 10
          done
          echo "Could not push the daily update" && exit 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - id: deployment
        uses: actions/deploy-pages@v4

name: Daily update

on:
  schedule:
    - cron: "20 17 * * 1-5"   # weekdays 17:20 UTC = 19:20 Finnish winter time, after Nordic markets close
  workflow_dispatch:          # "Run workflow" button on the Actions tab
  push:                       # a merged pull request goes live right away (publish only, no new prices)
    branches: [main]

permissions:
  contents: write             # save the updated portfolio / data back to the repository
  pages: write                # publish the site
  id-token: write

concurrency:                  # one run at a time; a merge during the daily run waits for it
  group: daily-update
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # newest main, including the bot's last data commit

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"

      - name: Install packages
        if: github.event_name != 'push'
        run: pip install -r requirements.txt

      - name: Fetch prices, update model, portfolio and simulation
        if: github.event_name != 'push'
        run: python update_site.py

      - name: Save results to the repository
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json portfolio.json simulation.json model.xlsx
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "Daily update $(date -u +%Y-%m-%d)"
          # someone may have merged a pull request while this run was working: put the data commit on top
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.event.repository.default_branch }}" && git push && exit 0
            sleep 10
          done
          echo "Could not push the daily update" && exit 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - id: deployment
        uses: actions/deploy-pages@v4

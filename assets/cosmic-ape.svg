<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" role="img" aria-label="Huge scruffy orange-brown monkey in a ripped jacket clashing two cymbals">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b76b3d"/><stop offset=".48" stop-color="#874624"/><stop offset="1" stop-color="#4e271b"/></linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5b877"/><stop offset=".65" stop-color="#d88d57"/><stop offset="1" stop-color="#a95c39"/></linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#708169"/><stop offset=".6" stop-color="#3d4f46"/><stop offset="1" stop-color="#242e33"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff3b3"/><stop offset=".25" stop-color="#e4a93e"/><stop offset=".65" stop-color="#a96a1a"/><stop offset="1" stop-color="#ffe0a0"/></linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <style>
    .arm-left{transform-box:view-box;transform-origin:114px 230px;animation:clank-left 1.25s cubic-bezier(.55,0,.35,1) infinite}
    .arm-right{transform-box:view-box;transform-origin:245px 230px;animation:clank-right 1.25s cubic-bezier(.55,0,.35,1) infinite}
    .clank{transform-box:fill-box;transform-origin:center;animation:clank-flash 1.25s ease-out infinite}
    .ape-head{transform-box:view-box;transform-origin:180px 139px;animation:head-bop 1.25s ease-in-out infinite}
    .eye{animation:eye-blink 6s ease-in-out infinite}
    @keyframes clank-left{0%,16%,72%,100%{transform:rotate(-18deg)}30%,44%{transform:rotate(18deg)}}
    @keyframes clank-right{0%,16%,72%,100%{transform:rotate(18deg)}30%,44%{transform:rotate(-18deg)}}
    @keyframes clank-flash{0%,25%,51%,100%{opacity:0;transform:scale(.3)}36%{opacity:1;transform:scale(1.2)}44%{opacity:.2;transform:scale(1.55)}}
    @keyframes head-bop{0%,100%{transform:rotate(-3deg)}35%{transform:rotate(4deg)}}
    @keyframes eye-blink{0%,45%,47%,100%{transform:scaleY(1)}46%{transform:scaleY(.1)}}
    @media(prefers-reduced-motion:reduce){.arm-left,.arm-right,.clank,.ape-head,.eye{animation:none}.clank{opacity:0}}
  </style>
  <ellipse cx="190" cy="415" rx="113" ry="13" fill="#010509" opacity=".5" filter="url(#shadow)"/>
  <!-- crooked furry tail, boots and torn trousers -->
  <path d="M123 328 C45 334 54 255 95 251 C126 249 118 288 95 284" fill="none" stroke="#492a20" stroke-width="24" stroke-linecap="round"/>
  <path d="M127 320 C123 341 120 369 117 390 L161 394 L183 341 M198 342 L212 393 L255 392 L243 324" fill="#423c3e" stroke="#281f25" stroke-width="8" stroke-linejoin="round"/>
  <path d="M124 348 L142 360 L127 371 M229 354 L245 363 L228 381" fill="none" stroke="#ac8b68" stroke-width="3" stroke-dasharray="5 5"/>
  <path d="M110 385 Q126 380 164 390 L167 407 Q130 418 97 407Z" fill="#66372a" stroke="#251d1b" stroke-width="6"/>
  <path d="M211 390 Q249 378 269 394 L271 409 Q249 421 209 407Z" fill="#5c5553" stroke="#251d1b" stroke-width="6"/>
  <path d="M104 402 L165 404 M211 406 L269 406" stroke="#d4c9af" stroke-width="4" stroke-linecap="round"/>
  <!-- patchwork coat and vest -->
  <path d="M118 213 Q153 197 180 205 Q213 194 252 219 L275 329 L243 351 L226 318 L205 354 L151 353 L128 317 L111 350 L86 331Z" fill="url(#coat)" stroke="#20302e" stroke-width="7" stroke-linejoin="round"/>
  <path d="M153 213 L181 253 L204 212 L227 329 L140 329Z" fill="#c3aa80" stroke="#493e38" stroke-width="4"/>
  <path d="M168 221 L186 259 L206 221 L198 316 L180 344 L171 313Z" fill="#8f3440"/>
  <path d="M187 260 L182 300 L195 321" stroke="#f1a49a" stroke-width="4" fill="none"/>
  <path d="M133 219 L171 271 L141 269 L167 325 L112 287Z" fill="#758873" stroke="#28362e" stroke-width="4"/>
  <path d="M228 215 L195 266 L223 266 L199 329 L254 299Z" fill="#637363" stroke="#28362e" stroke-width="4"/>
  <path d="M90 322 L104 311 L116 325 L99 341Z" fill="#9c563b" stroke="#e2ae6e" stroke-width="3" stroke-dasharray="5 4"/>
  <path d="M237 306 L259 310 L256 331 L235 326Z" fill="#9c453d" stroke="#e5c2a0" stroke-width="2" />
  <path d="M241 311 L251 324 M251 310 L242 324" stroke="#edcb91" stroke-width="2.5"/>
  <path d="M145 299 L151 313 L162 309" fill="none" stroke="#f5d08f" stroke-width="3" stroke-linecap="round"/>
  <circle cx="175" cy="292" r="4" fill="#d0ab69"/><circle cx="177" cy="314" r="4" fill="#d0ab69"/>
  <path d="M205 340 L194 352 L201 359 M108 351 L116 342 L124 347" fill="none" stroke="#c2a47a" stroke-width="3"/>
  <!-- loose long scarf -->
  <path d="M153 208 Q174 228 203 204 L217 218 L206 245 L177 227 L160 249Z" fill="#d36b4e" stroke="#542c2c" stroke-width="5"/>
  <path d="M163 238 L152 311 L171 315 L185 245Z" fill="#bd553f" stroke="#71382c" stroke-width="3"/>
  <path d="M155 300 L172 303" stroke="#e9b777" stroke-width="4"/>
  <!-- oversized shaggy head -->
  <g class="ape-head">
    <path d="M103 132 Q74 114 89 79 Q94 56 121 47 Q130 18 163 31 Q181 10 208 29 Q236 20 248 53 Q272 62 265 97 Q282 126 254 154 Q246 183 221 190 L133 192 Q105 176 103 132Z" fill="url(#fur)" stroke="#42251d" stroke-width="7"/>
    <ellipse cx="102" cy="125" rx="28" ry="33" fill="#a76947" stroke="#44271e" stroke-width="6"/>
    <ellipse cx="259" cy="126" rx="27" ry="33" fill="#a76947" stroke="#44271e" stroke-width="6"/>
    <ellipse cx="102" cy="125" rx="13" ry="18" fill="#6d3b30"/><ellipse cx="259" cy="126" rx="12" ry="18" fill="#6d3b30"/>
    <path d="M125 105 Q141 65 179 86 Q214 63 237 105 L235 151 Q214 180 177 183 Q140 179 125 155Z" fill="url(#face)" stroke="#985734" stroke-width="5"/>
    <ellipse cx="145" cy="123" rx="22" ry="25" fill="#eed0a2" stroke="#995e3e" stroke-width="3"/>
    <ellipse cx="214" cy="123" rx="22" ry="25" fill="#eed0a2" stroke="#995e3e" stroke-width="3"/>
    <g class="eye"><ellipse cx="151" cy="128" rx="7" ry="10" fill="#211b19"/><ellipse cx="212" cy="128" rx="7" ry="10" fill="#211b19"/><circle cx="153" cy="125" r="2" fill="#fff"/><circle cx="214" cy="125" r="2" fill="#fff"/></g>
    <path d="M128 111 Q148 101 167 111 M197 110 Q220 98 238 110" stroke="#4d2d25" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M154 153 Q167 138 180 146 Q194 137 207 153 L207 170 Q180 190 153 170Z" fill="#db9b67"/>
    <ellipse cx="179" cy="150" rx="15" ry="10" fill="#8a5342"/><circle cx="171" cy="149" r="3" fill="#3c2923"/><circle cx="188" cy="149" r="3" fill="#3c2923"/>
    <path d="M153 175 Q176 199 207 173 Q187 218 160 194Z" fill="#4b2726" stroke="#85463a" stroke-width="4"/>
    <path d="M162 181 Q180 191 199 181 L195 189 L168 191Z" fill="#fff6d6"/>
    <path d="M208 180 L219 185 L214 194" fill="none" stroke="#a86740" stroke-width="4"/>
    <path d="M137 191 L129 199 L145 204 M217 192 L228 201 L213 205" stroke="#74402d" stroke-width="5" fill="none"/>
    <!-- battered crooked beanie with patch -->
    <path d="M118 72 Q111 36 145 19 Q173 -1 209 24 Q232 38 226 78 Q180 59 118 83Z" fill="#733b48" stroke="#422932" stroke-width="7"/>
    <path d="M116 78 Q174 52 233 75 L231 91 Q175 77 119 98Z" fill="#8c4652" stroke="#422932" stroke-width="6"/>
    <path d="M155 33 L177 48 L167 59 L146 46Z" fill="#c9996f" stroke="#e6cb9d" stroke-width="3" stroke-dasharray="6 5"/>
    <path d="M218 41 Q236 28 243 52 L230 65Z" fill="#733b48" stroke="#422932" stroke-width="5"/>
  </g>
  <!-- clanging arms and polished brass cymbals -->
  <g class="arm-left">
    <path d="M114 229 Q94 250 112 268 Q133 278 162 225" fill="#8a5138" stroke="#492d26" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="150" cy="224" rx="16" ry="15" fill="#c18152" stroke="#673d2e" stroke-width="4"/>
    <ellipse cx="164" cy="202" rx="43" ry="22" fill="url(#brass)" stroke="#8c521c" stroke-width="5" transform="rotate(-17 164 202)"/>
    <ellipse cx="164" cy="202" rx="18" ry="8" fill="none" stroke="#ffe8a1" stroke-width="3" transform="rotate(-17 164 202)"/>
    <circle cx="164" cy="202" r="6" fill="#71411e" stroke="#fff0a9" stroke-width="2"/>
  </g>
  <g class="arm-right">
    <path d="M245 229 Q269 256 246 269 Q229 273 201 224" fill="#8a5138" stroke="#492d26" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="209" cy="223" rx="16" ry="15" fill="#c18152" stroke="#673d2e" stroke-width="4"/>
    <ellipse cx="197" cy="202" rx="43" ry="22" fill="url(#brass)" stroke="#8c521c" stroke-width="5" transform="rotate(17 197 202)"/>
    <ellipse cx="197" cy="202" rx="18" ry="8" fill="none" stroke="#ffe8a1" stroke-width="3" transform="rotate(17 197 202)"/>
    <circle cx="197" cy="202" r="6" fill="#71411e" stroke="#fff0a9" stroke-width="2"/>
  </g>
  <!-- clank! sparkle when brass plates hit -->
  <g class="clank" stroke="#fff3ae" fill="none" stroke-width="7" stroke-linecap="round">
    <path d="M180 161 L180 132 M180 236 L180 262 M141 197 L117 181 M219 197 L242 183 M150 165 L136 146 M211 165 L228 146" />
    <circle cx="181" cy="199" r="15" stroke="#ffcc5f" stroke-width="5"/>
  </g>
</svg>